<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Control Center · Sign in</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="login-wrap">
    <form class="login-box" id="login-form">
      <h1>🛰️ Control Center</h1>
      <p class="login-sub">Enter the dashboard password to continue.</p>
      <input type="password" id="password" placeholder="Password" autofocus autocomplete="current-password" />
      <button type="submit">Sign in</button>
      <div class="login-err" id="err"></div>
    </form>
  </div>
  <script>
    const form = document.getElementById("login-form");
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const err = document.getElementById("err");
      err.textContent = "";
      const password = document.getElementById("password").value;
      try {
        const res = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ password }),
        });
        if (res.ok) {
          window.location.href = "/";
        } else {
          const d = await res.json().catch(() => ({}));
          err.textContent = d.detail || "Sign in failed";
        }
      } catch (e) {
        err.textContent = "Network error";
      }
    });
  </script>
</body>
</html>
