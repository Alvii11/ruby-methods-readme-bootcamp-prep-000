# Control Center configuration
#
# Copy this file to `config.yaml` and edit it to describe the bots / scripts
# you already have on your Mac. Each entry is a process the Control Center
# can start, stop, restart, monitor, and tail logs for.
#
# The Control Center NEVER places trades or talks to a broker itself. It only
# supervises the programs YOU point it at. Your trading logic stays in your
# own scripts; this dashboard just runs and watches them.

# Where per-bot log files are written (relative to this file or absolute).
log_dir: ./logs

# Host/port for the dashboard.
#   127.0.0.1  -> reachable only from this machine (default, safest).
#   0.0.0.0    -> reachable from your network. ONLY do this with auth + TLS on.
host: 127.0.0.1
port: 8765

# --- Remote access / authentication ----------------------------------------
# Required whenever the dashboard is reachable beyond localhost — it can start
# arbitrary processes, so never expose it unauthenticated.
auth:
  enabled: false           # set true to require a password
  # Provide the password ONE of two ways:
  #   1) env var (preferred):  export CC_PASSWORD='something-strong'
  password_env: CC_PASSWORD
  #   2) or a sha256 hash here (run ./hash-password.sh to generate):
  # password_sha256: "<64-hex-char digest>"
  session_hours: 12        # how long a login stays valid
  # secret: "<random string>"   # cookie-signing key; else $CC_SECRET, else random per run

# --- TLS (HTTPS) ------------------------------------------------------------
# Encrypts traffic. Generate a self-signed cert with ./gen-cert.sh, then:
tls:
  certfile: null           # e.g. ./certs/cert.pem
  keyfile: null            # e.g. ./certs/key.pem

# --- Crash alerts -----------------------------------------------------------
# Get notified when a bot dies, so you don't have to watch the dashboard.
alerts:
  enabled: false
  on_crash: true           # bot exited with a non-zero code (and you didn't stop it)
  on_exit: false           # bot exited cleanly (code 0) on its own
  on_restart: false        # auto-restart kicked in after a death
  # Channels (enable any combination):
  desktop: false           # macOS notification (Linux: notify-send) — local only
  # Slack incoming webhook — paste the URL or keep it in an env var:
  slack_webhook_env: CC_SLACK_WEBHOOK   # export CC_SLACK_WEBHOOK='https://hooks.slack.com/...'
  # slack_webhook: "https://hooks.slack.com/services/XXX/YYY/ZZZ"
  # Email via SMTP (credentials come from env vars, not this file):
  # email:
  #   smtp_host: smtp.gmail.com
  #   smtp_port: 587
  #   use_tls: true
  #   username_env: CC_SMTP_USER     # export CC_SMTP_USER='you@gmail.com'
  #   password_env: CC_SMTP_PASS     # export CC_SMTP_PASS='app-password'
  #   sender: you@gmail.com
  #   recipients: [you@gmail.com]

bots:
  - id: momentum-trader
    name: Momentum Trader
    group: trading
    description: Example trading bot. Replace command with your real script.
    # Use a list (no shell) for safety, or set shell: true to use a string.
    command: ["python3", "momentum_bot.py"]
    cwd: /Users/you/bots/momentum
    autorestart: true
    env:
      MODE: paper          # paper vs live — keep your own kill-switch in the bot!

  - id: arb-scanner
    name: Arbitrage Scanner
    group: trading
    command: "python3 scanner.py --exchange coinbase"
    shell: true
    cwd: /Users/you/bots/arb
    autorestart: false

  - id: price-monitor
    name: Price / Health Monitor
    group: monitoring
    description: Watches prices/feeds and emits alerts.
    command: ["python3", "monitor.py"]
    cwd: /Users/you/bots/monitor
    autorestart: true

  - id: nightly-backup
    name: Nightly Backup
    group: other
    command: "bash backup.sh"
    shell: true
    cwd: /Users/you/scripts
    autorestart: false
